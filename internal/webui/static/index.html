<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Кладовка</title>
  <style>
    :root {
      --bg: #0e0c0a;
      --panel: rgba(26, 20, 14, 0.82);
      --panel-hover: rgba(40, 30, 20, 0.92);
      --panel-border: rgba(255, 200, 120, 0.16);
      --text: #f3ebe2;
      --muted: #b8a99a;
      --accent: #d97706;
      --accent-hi: #f59e0b;
      --ok: #65a30d;
      --bad: #dc2626;
      --stencil: rgba(0, 0, 0, 0.55);
      --focus: rgba(245, 158, 11, 0.45);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        linear-gradient(180deg, rgba(10, 8, 6, 0.55) 0%, rgba(10, 8, 6, 0.72) 100%),
        image-set(url("img/ui-bg.jpg") 1x, url("img/ui-bg@2x.jpg") 2x);
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 70% 45% at 8% 0%, rgba(217, 119, 6, 0.18), transparent 60%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 3px);
      mix-blend-mode: soft-light;
    }
    header, main, .toast { position: relative; z-index: 1; }
    header {
      padding: 1.5rem 1.25rem 1rem;
      border-bottom: 1px solid rgba(255, 200, 120, 0.12);
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.45), transparent);
    }
    .header-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      margin: 0;
      font-family: "IBM Plex Serif", Georgia, serif;
      font-size: clamp(1.9rem, 4.5vw, 2.8rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(0,0,0,0.85), 2px 3px 0 var(--stencil), 0 0 24px rgba(217,119,6,0.25);
    }
    .sub { color: var(--muted); margin: 0.35rem 0 0; }
    .tag {
      display: inline-block;
      margin-top: 0.55rem;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fbbf24;
      border: 1px dashed rgba(251, 191, 36, 0.45);
      padding: 0.2rem 0.55rem;
      background: rgba(0, 0, 0, 0.35);
    }
    .toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    main {
      padding: 1.25rem;
      display: grid;
      gap: 1rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 1rem 1.1rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.35) inset, 0 12px 40px rgba(0,0,0,0.35);
    }
    .section-head {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
    }
    h2 {
      margin: 0;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fbbf24;
    }
    button, input, .link-btn {
      font: inherit;
      border-radius: 4px;
      border: 1px solid #564536;
      background: #1f1914;
      color: var(--text);
      padding: 0.55rem 0.85rem;
      transition: transform 0.12s ease, filter 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    }
    button, .link-btn {
      background: var(--accent);
      border-color: #b45309;
      color: #1a1208;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      user-select: none;
    }
    button:hover, .link-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    button:active, .link-btn:active { transform: translateY(0); filter: brightness(0.96); }
    button:focus-visible, .link-btn:focus-visible, input:focus-visible, .stat:focus-visible, .polka:focus-visible, .node:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    button.ghost, .link-btn.ghost {
      background: rgba(0,0,0,0.35);
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.35);
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    input {
      min-width: 12rem;
      flex: 1;
    }
    input:focus { border-color: var(--accent-hi); }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.65rem;
    }
    .stat {
      appearance: none;
      width: 100%;
      text-align: left;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,200,120,0.12);
      border-radius: 6px;
      padding: 0.85rem 0.9rem;
      color: var(--text);
      cursor: pointer;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 500;
      display: block;
    }
    .stat:hover {
      background: var(--panel-hover);
      border-color: rgba(251, 191, 36, 0.4);
      transform: translateY(-2px);
    }
    .stat .label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .stat .value {
      display: block;
      font-size: 1.35rem;
      font-weight: 700;
      color: #fde68a;
      line-height: 1.2;
    }
    .stat .hint {
      display: block;
      margin-top: 0.25rem;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }
    .meter {
      margin-top: 0.85rem;
      background: rgba(0,0,0,0.4);
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,200,120,0.1);
    }
    .meter > span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #b45309, #fbbf24);
      transition: width 0.4s ease;
    }
    .meter-label { margin-top: 0.4rem; font-size: 0.8rem; color: var(--muted); }
    .polki, .nodes { display: grid; gap: 0.55rem; }
    .polka, .node {
      width: 100%;
      text-align: left;
      background: rgba(0,0,0,0.32);
      border: 1px solid rgba(255,200,120,0.12);
      color: var(--text);
      border-radius: 6px;
      padding: 0.85rem 0.95rem;
      cursor: pointer;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 500;
      display: grid;
      gap: 0.35rem;
    }
    .polka:hover, .node:hover {
      background: var(--panel-hover);
      border-color: rgba(251, 191, 36, 0.45);
      transform: translateY(-1px);
    }
    .polka.open, .node.open { border-color: var(--accent-hi); box-shadow: 0 0 0 1px rgba(245,158,11,0.25); }
    .polka-top, .node-top {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: center;
    }
    .polka strong, .node strong { font-size: 1.05rem; }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .pill {
      font-size: 0.72rem;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .ok { background: color-mix(in srgb, var(--ok) 25%, transparent); color: #bbf7d0; }
    .bad { background: color-mix(in srgb, var(--bad) 25%, transparent); color: #fecaca; }
    .detail {
      display: none;
      margin-top: 0.55rem;
      padding-top: 0.55rem;
      border-top: 1px dashed rgba(255,200,120,0.15);
    }
    .polka.open .detail, .node.open .detail { display: block; }
    .objs { list-style: none; padding: 0; margin: 0; }
    .objs li {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.4rem 0;
      border-bottom: 1px dashed rgba(255,200,120,0.08);
      font-size: 0.88rem;
    }
    .objs li:last-child { border-bottom: 0; }
    .empty { color: var(--muted); font-size: 0.9rem; padding: 0.5rem 0; }
    .quick {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.5rem;
    }
    .quick a {
      text-decoration: none;
      color: #fde68a;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,200,120,0.14);
      border-radius: 6px;
      padding: 0.75rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .quick a:hover {
      background: var(--panel-hover);
      border-color: rgba(251, 191, 36, 0.45);
      transform: translateY(-2px);
    }
    .quick a span { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
    .quick a strong { font-size: 0.95rem; }
    .toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 20;
      background: #1a1208;
      color: #fde68a;
      border: 1px solid rgba(251, 191, 36, 0.45);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: min(360px, calc(100vw - 2rem));
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.err { color: #fecaca; border-color: rgba(220, 38, 38, 0.5); }
    .ops {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.75rem;
    }
    .chip {
      font-size: 0.78rem;
      padding: 0.3rem 0.55rem;
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,200,120,0.12);
      color: var(--muted);
    }
    .chip b { color: #fde68a; font-weight: 700; }

    .polka-card {border:1px solid var(--panel-border);border-radius:6px;overflow:hidden}
    .polka-card .polka {border:0;border-radius:0}
    .polka-card .detail {display:block;margin:0;padding:0.85rem}
    .polka-card .detail[hidden] {display:none}
    .file-actions {display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap}
    .file-actions a {color:#fde68a;overflow-wrap:anywhere}
    .file-actions button {font-size:0.7rem}
    .objs li {align-items:center;flex-wrap:wrap}
    .objs li span:first-child {overflow-wrap:anywhere;min-width:0}
    .danger {background:#7f1d1d;color:#fee2e2;border-color:#991b1b}
    .upload-label {cursor:pointer;border:1px solid var(--panel-border);padding:0.5rem;display:block}
    @media(max-width:500px){main{padding:0.75rem} section{padding:0.8rem} .stats{grid-template-columns:repeat(2,minmax(0,1fr))} input{min-width:0;width:100%} .polka-top,.node-top{flex-wrap:wrap}}
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <h1>Кладовка</h1>
        <p class="sub">Объектное хранилище</p>
        <span class="tag">Панель управления</span>
      </div>
      <div class="toolbar">
        <button type="button" class="ghost" id="refresh" title="Обновить сейчас">↻ Обновить</button>
        <label class="meta" style="display:flex;align-items:center;gap:0.35rem;cursor:pointer;">
          <input type="checkbox" id="autorefresh" checked style="min-width:auto;accent-color:#d97706;" />
          авто · 5с
        </label>
      </div>
    </div>
  </header>

  <main>
    <section id="sec-stats">
      <div class="section-head">
        <h2>Статистика</h2>
        <span class="meta" id="updated">загрузка…</span>
      </div>
      <div class="stats" id="stats"></div>
      <div class="meter" aria-hidden="true"><span id="diskbar"></span></div>
      <div class="meter-label" id="disklabel">диск: —</div><p class="meta">Объекты и счётчики относятся к этой ноде. Диск — вся файловая система DATA_ROOT.</p>
      <div class="ops" id="ops"></div>
    </section>

    <section id="sec-polki">
      <div class="section-head">
        <h2>Полки</h2>
        <span class="meta" id="polki-count"></span>
      </div>
      <div class="row" style="margin-bottom:0.75rem;">
        <input id="polka" placeholder="имя новой полки" autocomplete="off" />
        <button type="button" id="create">+ Создать</button>
      </div>
      <input id="filter" type="search" placeholder="Найти полку" aria-label="Найти полку" style="width:100%;margin-bottom:0.75rem" />
      <div class="polki" id="polki"></div>
    </section>

    <section id="sec-nodes">
      <div class="section-head">
        <h2>Кластер</h2>
        <span class="meta" id="nodes-count"></span>
      </div>
      <div class="nodes" id="nodes"></div>
    </section>

    <section>
      <div class="section-head"><h2>Быстрые ссылки</h2></div>
      <div class="quick">
        <a href="/healthz" target="_blank" rel="noopener"><span>health</span><strong>/healthz</strong></a>
        <a href="/cluster" target="_blank" rel="noopener"><span>кластер json</span><strong>/cluster</strong></a>
        <a href="/api/stats" target="_blank" rel="noopener"><span>статистика</span><strong>/api/stats</strong></a>
        <a href="/metrics" target="_blank" rel="noopener"><span>prometheus</span><strong>/metrics</strong></a>
        <a href="/api/polki" target="_blank" rel="noopener"><span>полки api</span><strong>/api/polki</strong></a>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let timer, openPolka=null, busy=false, refreshing=false, polki=[], signature='';
    function bytes(n) {n=Number(n)||0;const units=['B','KiB','MiB','GiB','TiB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return (i?n.toFixed(1):n)+' '+units[i]}
    function uptime(n){n=Math.floor(n||0);return Math.floor(n/3600)+'ч '+Math.floor(n%3600/60)+'м '+n%60+'с'}
    function toast(message,error=false){$('toast').textContent=message;$('toast').className='toast show'+(error?' err':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),5000)}
    async function api(url,options={}){const response=await fetch(url,options);if(!response.ok)throw Error((await response.text()).slice(0,500)||response.status);return response}
    function objectURL(name,key){return '/api/object/'+encodeURIComponent(name)+'/'+key.split('/').map(encodeURIComponent).join('/')}
    function renderStats(j){const m=j.metrics||{};const cards=[
      ['Полки',j.polki_count,'Локальные полки','sec-polki'],['Объекты',j.objects_count,bytes(j.objects_bytes),'sec-polki'],
      ['Ноды',j.nodes_healthy+'/'+j.nodes_total,'Копий: '+j.replication_factor,'sec-nodes'],['Аптайм',uptime(m.uptime_seconds),j.node_id,'sec-nodes'],
      ['HTTP',m.http_requests_total,'Включая панель','sec-stats'],['S3',m.s3_operations_total,'Операций','sec-stats'],
      ['Загружено',bytes(m.bytes_uploaded_total),'С запуска','sec-stats'],['Скачано',bytes(m.bytes_downloaded_total),'С запуска','sec-stats']];
      $('stats').innerHTML=cards.map(([label,value,hint,go])=>`<button class="stat" data-go="${go}"><span class="label">${esc(label)}</span><span class="value">${esc(value)}</span><span class="hint">${esc(hint)}</span></button>`).join('');
      $('stats').querySelectorAll('button').forEach(b=>b.onclick=()=>$(b.dataset.go).scrollIntoView({behavior:'smooth'}));
      const total=m.storage_total_bytes||0,used=m.storage_used_bytes||0,pct=total?Math.round(100*used/total):0;
      $('diskbar').style.width=Math.min(100,pct)+'%';$('disklabel').textContent=total?`Файловая система: ${bytes(used)} из ${bytes(total)} (${pct}%)`:'Ёмкость файловой системы неизвестна';
      $('ops').innerHTML=Object.entries(m.s3_by_operation||{}).map(([k,v])=>`<span class="chip">${esc(k)}: <b>${esc(v)}</b></span>`).join('')+`<span class="chip">Репликация: успешно ${esc(m.replication_ok_total)} / ошибок ${esc(m.replication_failed_total)}</span>`;
      $('updated').textContent='Обновлено '+new Date().toLocaleTimeString();
    }
    function renderPolki(force=false){const filter=$('filter').value.toLowerCase(),next=JSON.stringify([polki,filter,openPolka]);if(!force&&next===signature)return;signature=next;
      $('polki-count').textContent=polki.length+' шт.';const visible=polki.filter(p=>p.name.toLowerCase().includes(filter));
      $('polki').innerHTML=visible.map(p=>`<article class="polka-card"><button class="polka" data-name="${esc(p.name)}" aria-expanded="${p.name===openPolka}"><span class="polka-top"><strong>${esc(p.name)}</strong><span class="pill ok">${esc(p.objects)} объектов</span></span><span class="meta">${bytes(p.bytes)} · открыть</span></button><div class="detail" ${p.name===openPolka?'':'hidden'}></div></article>`).join('')||'<p class="empty">'+(polki.length?'Полки не найдены':'Создайте первую полку выше')+'</p>';
      $('polki').querySelectorAll('.polka').forEach(button=>button.onclick=()=>{openPolka=openPolka===button.dataset.name?null:button.dataset.name;renderPolki(true)});
      const button=[...$('polki').querySelectorAll('.polka')].find(b=>b.dataset.name===openPolka);if(button)openDetail(button.parentElement.querySelector('.detail'),openPolka);
    }
    async function openDetail(detail,name){
      detail.innerHTML=`<div class="row"><input class="prefix" placeholder="Папка для загрузки, например photos/" aria-label="Папка для загрузки"/><label class="upload-label">Загрузить файлы <input class="upload" type="file" multiple style="min-width:0;max-width:100%"/></label><button class="danger delete-polka">Удалить пустую полку</button></div><p class="meta">Файлы с тем же ключом перезаписываются.</p><ul class="objs"></ul><button class="ghost more" hidden>Ещё 100</button><p class="meta list-state">Загрузка…</p>`;
      detail.querySelector('.delete-polka').onclick=async()=>{if(!confirm('Удалить пустую полку «'+name+'»?'))return;await action(async()=>{await api('/api/polki/'+encodeURIComponent(name),{method:'DELETE'});openPolka=null;signature='';await refresh();toast('Полка удалена')})};
      detail.querySelector('.upload').onchange=async e=>{const files=[...e.target.files];let prefix=detail.querySelector('.prefix').value.replace(/^\/+|\/+$/g,'');if(prefix)prefix+='/';await action(async()=>{for(const file of files){toast('Загрузка '+file.name);await api(objectURL(name,prefix+file.name),{method:'PUT',headers:{'Content-Type':file.type||'application/octet-stream'},body:file})}signature='';await refresh();toast('Загружено файлов: '+files.length)})};
      let after='';async function page(){const button=detail.querySelector('.more');button.disabled=true;try{const j=await (await api('/api/polki/'+encodeURIComponent(name)+'?start-after='+encodeURIComponent(after))).json();
        const list=detail.querySelector('.objs');for(const object of j.objects||[]){const li=document.createElement('li');li.innerHTML=`<span>${esc(object.key)}</span><div class="file-actions"><span class="meta">${bytes(object.size)}</span><a href="${esc(objectURL(name,object.key))}" download>Скачать</a><button class="ghost">Удалить</button></div>`;li.querySelector('button').onclick=async()=>{if(!confirm('Удалить «'+object.key+'»?'))return;await action(async()=>{await api(objectURL(name,object.key),{method:'DELETE'});signature='';await refresh();toast('Файл удалён')})};list.appendChild(li)}
        after=j.next_start_after||'';button.hidden=!j.truncated;detail.querySelector('.list-state').textContent=list.children.length?'Показано объектов: '+list.children.length:'Полка пуста';
      }catch(e){detail.querySelector('.list-state').textContent='Ошибка: '+e.message}finally{button.disabled=false}}
      detail.querySelector('.more').onclick=page;await page();
    }
    function renderNodes(j){$('nodes-count').textContent='Эта нода: '+j.node_id+' · копий: '+j.replication_factor;
      $('nodes').innerHTML=(j.nodes||[]).map(n=>`<button class="node" data-url="${esc(n.url)}"><span class="node-top"><strong>${esc(n.node_id)}</strong><span class="pill ${n.healthy?'ok':'bad'}">${n.healthy?'Доступна':'Недоступна'}</span></span><span class="meta">${esc(n.url)} · диск ${bytes(n.used_bytes)} ${esc(n.last_error||'')}</span></button>`).join('');
      $('nodes').querySelectorAll('button').forEach(button=>button.onclick=()=>{try{const u=new URL(button.dataset.url);if(!['https:','http:'].includes(u.protocol))throw Error('Недопустимый URL');u.pathname='/ui/';u.search='';u.hash='';window.open(u.href,'_blank','noopener')}catch(e){toast(e.message,true)}});
    }
    async function refresh(){if(refreshing)return;refreshing=true;$('refresh').disabled=true;try{const j=await(await api('/api/stats')).json();renderStats(j);polki=j.polki||[];renderPolki();renderNodes(j)}catch(e){toast('Не удалось обновить: '+e.message,true)}finally{refreshing=false;$('refresh').disabled=false}}
    async function action(fn){if(busy)return;busy=true;try{await fn()}catch(e){toast(e.message,true)}finally{busy=false}}
    async function create(){const name=$('polka').value.trim();if(!name){$('polka').focus();return}await action(async()=>{await api('/api/polki',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});$('polka').value='';openPolka=name;signature='';await refresh();toast('Полка создана')})}
    $('refresh').onclick=()=>{signature='';refresh()};$('create').onclick=create;$('polka').onkeydown=e=>{if(e.key==='Enter')create()};$('filter').oninput=()=>renderPolki();
    function schedule(){clearInterval(timer);if($('autorefresh').checked)timer=setInterval(()=>{if(!busy&&!document.hidden&&document.activeElement.tagName!=='INPUT')refresh()},5000)}
    $('autorefresh').onchange=schedule;refresh();schedule();
  </script>
</body>
</html>
