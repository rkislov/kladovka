name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: make build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-s3-clients.txt
      - run: python3 -m pip install -r scripts/requirements-s3-clients.txt
      - name: AWS CLI and backup/restore integration
        run: |
          python3 scripts/smoke.py --binary ./bin/kladovka --sdk-clients
          python3 scripts/smoke.py --binary ./bin/kladovka --access-policy --sdk-clients
          python3 scripts/consensus_smoke.py --binary ./bin/kladovka --sdk-clients
      - name: Version history and trash SDK contract
        run: python3 scripts/versioning_smoke.py --binary ./bin/kladovka
      - name: Load pilot harness contract (small fixture, no performance gate)
        run: |
          python3 -m unittest discover -s scripts -p test_load_pilot.py
          python3 scripts/load_pilot.py --binary ./bin/kladovka --stages 10,25 --samples 3 --output load-pilot-ci.json
      - name: Consensus materialization catch-up and restart
        run: python3 scripts/materialization_pilot.py --binary ./bin/kladovka --objects 32 --output materialization-ci.json
      - name: Cold/mixed LIST and unique-object workload contract
        run: |
          python3 -m unittest discover -s scripts -p test_workload_pilot.py
          python3 scripts/workload_pilot.py --binary ./bin/kladovka --catalog-objects 25 --cold-samples 1 --samples 3 --mixed-cycles 8 --large-bytes 1048576 --large-count 2 --output workload-ci.json
      - name: Sustained-write harness contract (tiny fixture, no performance gate)
        run: python3 scripts/write_pilot.py --binary ./bin/kladovka --runs 1 --objects 4 --warmup 1 --idle-seconds 1 --output write-pilot-ci.json
      - name: Fixed-key overwrite, offline catch-up and restart contract
        run: python3 scripts/overwrite_pilot.py --binary ./bin/kladovka --keys 4 --size 4096 --seconds 1 --idle-seconds 1 --output overwrite-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-pilot-${{ github.event_name }}
          path: |
            load-pilot-ci.json
            materialization-ci.json
            workload-ci.json
            write-pilot-ci.json
            overwrite-ci.json
          if-no-files-found: ignore
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:css
      - run: git diff --exit-code -- internal/webui/static/app.css
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus configuration and alert scenarios
        env:
          PROMETHEUS_IMAGE: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring:/work:ro" -w /work "$PROMETHEUS_IMAGE" check config --syntax-only prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring:/work:ro" -w /work "$PROMETHEUS_IMAGE" check rules alerts.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring:/work:ro" -w /work "$PROMETHEUS_IMAGE" test rules alerts.test.yml
