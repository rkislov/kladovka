name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: make build
      - name: AWS CLI and backup/restore integration
        run: |
          python3 scripts/smoke.py --binary ./bin/kladovka
          python3 scripts/smoke.py --binary ./bin/kladovka --access-policy
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:css
      - run: git diff --exit-code -- internal/webui/static/app.css
